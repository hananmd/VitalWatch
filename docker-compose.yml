# Local stack: backend + PostgreSQL.
# First run:  cp .env.example .env   (then set a password)
# Start:      docker compose up --build
# Stop:       docker compose down        (keeps data)
# Reset data: docker compose down -v     (deletes the postgres volume)

name: vitalwatch

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalwatch}
      POSTGRES_USER: ${POSTGRES_USER:-vitalwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # localhost only, for local tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      VITALWATCH_ENVIRONMENT: ${VITALWATCH_ENVIRONMENT:-local}
      VITALWATCH_LOG_LEVEL: ${VITALWATCH_LOG_LEVEL:-INFO}
      VITALWATCH_JWT_SECRET: ${VITALWATCH_JWT_SECRET:?set VITALWATCH_JWT_SECRET in .env (see .env.example)}
      VITALWATCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vitalwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitalwatch}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Least privilege: jobs only read the repo
permissions:
  contents: read

# A new push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  IMAGE: vitalwatch-backend:ci

jobs:
  branch-flow:
    name: Branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Feature branch, then dev, then main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python .github/scripts/check_branch_flow.py

  lint-test:
    name: Lint and test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vitalwatch
          POSTGRES_USER: vitalwatch
          POSTGRES_PASSWORD: ci-only-password # throwaway CI database, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalwatch -d vitalwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VITALWATCH_ENVIRONMENT: test
      # DB tests create and drop their own randomly named databases on this server
      VITALWATCH_TEST_DATABASE_URL: postgresql+psycopg://vitalwatch:ci-only-password@localhost:5432/vitalwatch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Tests
        run: uv run pytest

  docker:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name backend -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL "$IMAGE"
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:8000/health; do sleep 1; done' \
            || { docker logs backend; exit 1; }
          echo
          test "$(docker exec backend id -u)" != "0" || { echo "container runs as root"; exit 1; }
          docker rm -f backend

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan (repo dependencies, secrets, config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
